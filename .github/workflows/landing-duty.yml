name: Landing duty

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [dependabot_alert]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  duty:
    if: >-
      vars.LANDING_MODEL != '' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'repository_dispatch' && github.event.action == 'dependabot_alert') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch != github.event.repository.default_branch)) &&
        github.event.workflow_run.conclusion == 'failure' && vars.LANDING_BUMP_ON_FAILURE != 'false') ||
       contains(github.event.comment.body, '/landing'))
    concurrency:
      group: landing-duty-${{ github.repository_id }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || (github.event.client_payload.alert_number && format('alert-{0}', github.event.client_payload.alert_number)) || github.event.workflow_run.head_branch || 'dependencies' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
      GIT_AUTHOR_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Prepare GitHub Git authentication
        run: |
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT
          gh auth setup-git
      - name: Read dependency update publishing identity
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' && startsWith(github.event.workflow_run.head_branch, 'deps/landing-')
        run: |
          echo "LANDING_PUBLISHING_ACTOR=$(gh api graphql -f query='{viewer{login}}' --jq .data.viewer.login)" >> "$GITHUB_ENV"
      - name: Handle the delegated comment or native failure
        if: >-
          github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
        timeout-minutes: 15
        uses: bubbuild/landing@9014baa64f82893dc194a3f1e31391737f68c426
        env:
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          trust: ${{ vars.LANDING_TRUST || 'repository' }}
          upstream-workflow: |
            CI
            Release
          command: triage
          checked-revision: ''
          delivery-key: ${{ format('duty:{0}', github.event.comment.id || github.run_id) }}
          instruction: >-
            For comments, follow the explicit delegated command and report native check evidence.
            For workflow_run events, follow only the triggering native workflow (${{ github.event.workflow_run.name }}). Its conclusion is ${{ github.event.workflow_run.conclusion }}.
            Read affected jobs or deployment evidence through gh. Search for a matching issue only when this event supplies relevant failure or recovery evidence.
            Update an existing issue only for useful new evidence, changed conditions or verified progress; otherwise complete without a public write.
            Do not scan unrelated open issues or resolved historical failures. Tests do not establish publication. Publish Request validates issues and calls Release; Release publishes one package to PyPI. Preserve its approval label, input validation, default-branch restriction and trusted-publishing environment. Do not add a release-main workflow or publish packages yourself.
      - name: Handle dependency updates
        if: >-
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
          github.event_name == 'repository_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' &&
           github.event.workflow_run.head_branch != github.event.repository.default_branch)
        timeout-minutes: 15
        uses: bubbuild/landing@9014baa64f82893dc194a3f1e31391737f68c426
        env:
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          trust: ${{ vars.LANDING_TRUST || 'repository' }}
          upstream-workflow: CI
          bump-on-failure: ${{ vars.LANDING_BUMP_ON_FAILURE || 'true' }}
          dependency-update-actors: |
            dependabot[bot]
            renovate[bot]
            ${{ env.LANDING_PUBLISHING_ACTOR }}
            ${{ vars.LANDING_DEPENDENCY_UPDATE_ACTORS }}
          # The Action resolves relayed alert state: open -> bump, closed -> triage.
          command: bump
          checked-revision: ''
          delivery-key: ${{ github.event_name != 'workflow_run' && format('duty:{0}', github.run_id) || '' }}
          instruction: >-
            Maintain this repository's dependencies, scoped to the supplied candidate or alert when present.
            For a closed alert routed to triage, reconcile existing tracking issues using current API evidence; do not start dependency edits.
            Use fresh isolated candidate checkouts and run uv run --frozen --group test pytest after edits.
            Do not bump package release versions or publish to PyPI; maintainers use the existing publish-request process.
            Use uv for Python runtime and development dependencies; follow project version policy and preserve pinning style.
            You may publish new updates as draft PRs on fresh deps/landing-* branches and append repair commits to the supplied PR's existing branch.
            You may start required independent CI by dispatching ci.yml on the candidate branch with number=<PR number> and head=<full candidate SHA>; verify the run head SHA before citing results and maintain necessary tracking issues.
            Maintainers decide merge and alert dismissal.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: landing-duty-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
