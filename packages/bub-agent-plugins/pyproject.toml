[project]
name = "bub-agent-plugins"
version = "0.1.0"
description = "Load portable Agent Plugins into Bub"
readme = "README.md"
authors = [
    { name = "Bub contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
    "pydantic-settings>=2.10.1",
]

[project.entry-points.bub]
agent-plugins = "bub_agent_plugins.plugin:AgentPluginsPlugin"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
