name: Release

on:
  workflow_call:
    inputs:
      subpackage:
        description: Package name under packages/
        required: true
        type: string
      version:
        description: PEP 440 version to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      subpackage:
        description: Package name under packages/
        required: true
        type: string
      version:
        description: PEP 440 version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.subpackage }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.subpackage }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/${{ inputs.subpackage }}
    permissions:
      contents: read
      id-token: write
    env:
      SUBPACKAGE: ${{ inputs.subpackage }}
      VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must run from the default branch: $DEFAULT_BRANCH"
            exit 1
          fi

          if [[ ! "$SUBPACKAGE" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Invalid subpackage name: $SUBPACKAGE"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Validate package and PyPI version
        run: >-
          python scripts/validate_publish_request.py
          --subpackage "$SUBPACKAGE"
          --version "$VERSION"
          --repository .

      - name: Set version
        run: uv version --package "$SUBPACKAGE" --frozen "$VERSION"

      - name: Build package
        run: uv build --package "$SUBPACKAGE" --out-dir dist --clear

      # Trusted Publishing; signs and uploads PEP 740 attestations.
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/
          attestations: true
