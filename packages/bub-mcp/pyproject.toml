[project]
name = "bub-mcp"
version = "0.2.0"
description = "Expose configured MCP servers as Bub tools"
readme = "README.md"
authors = [
    { name = "Frost Ming", email = "me@frostming.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bub>=0.5.0,<0.6.0",
    "fastmcp>=3.2.0,<4",
    "loguru>=0.7.3",
    "mcp>=1.27.1,<2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.10.1",
    "typer>=0.24.1",
]

[project.entry-points.bub]
mcp = "bub_mcp.plugin:MCPPlugin"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
