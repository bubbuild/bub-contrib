name: Landing duty

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [dependabot_alert]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  vulnerability-alerts: read

jobs:
  duty:
    if: >-
      vars.LANDING_MODEL != '' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'repository_dispatch' && github.event.action == 'dependabot_alert') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch != github.event.repository.default_branch)) &&
        github.event.workflow_run.conclusion == 'failure' && vars.LANDING_BUMP_ON_FAILURE != 'false') ||
       contains(github.event.comment.body, '/landing'))
    concurrency:
      group: landing-duty-${{ github.repository_id }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || (github.event.client_payload.alert_number && format('alert-{0}', github.event.client_payload.alert_number)) || github.event.workflow_run.head_branch || 'dependencies' }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANDING_MODEL: ${{ vars.LANDING_MODEL }}
      LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
      LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
      LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
      LANDING_MODEL_TIMEOUT_SECONDS: '120'
      GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
      GIT_AUTHOR_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Prepare GitHub Git authentication
        run: gh auth setup-git
      - name: Read dependency update publishing identity
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' && startsWith(github.event.workflow_run.head_branch, 'deps/landing-')
        run: |
          echo "LANDING_PUBLISHING_ACTOR=$(gh api graphql -f query='{viewer{login}}' --jq .data.viewer.login)" >> "$GITHUB_ENV"
      - name: Handle the event
        timeout-minutes: 15
        uses: bubbuild/landing@main
        with:
          trust: ${{ vars.LANDING_TRUST || 'repository' }}
          upstream-workflow: |
            CI
            Release
          command: bump
          bump-on-failure: ${{ vars.LANDING_BUMP_ON_FAILURE || 'true' }}
          dependency-update-actors: |
            dependabot[bot]
            renovate[bot]
            ${{ env.LANDING_PUBLISHING_ACTOR }}
            ${{ vars.LANDING_DEPENDENCY_UPDATE_ACTORS }}
          checked-revision: ''
          delivery-key: ${{ github.event_name != 'workflow_run' && format('duty:{0}', github.event.comment.id || github.run_id) || '' }}
          instruction: >-
            Triage only the triggering failure or closed alert; reuse matching issues and publish only new evidence.
            Update dependencies with uv in isolated checkouts, preserving constraints and pins; run uv run --frozen --group test pytest.
            Publish new updates as draft deps/landing-* PRs or repair the supplied branch. Dispatch ci.yml on that branch with number=<PR> and head=<SHA>; verify native results.
            Preserve Publish Request/Release controls; do not publish packages, change release versions, merge PRs, or dismiss alerts.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: landing-duty-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
