[project]
name = "bub-sandbox-env"
version = "0.1.0"
description = "Run Bub sessions' bash, fs and code-mode tools in a lightweight local sandbox (macOS Seatbelt, Linux bubblewrap)"
readme = "README.md"
authors = [
    { name = "Frost Ming", email = "me@frostming.com" }
]
requires-python = ">=3.12"
dependencies = [
    # provide_environment exists from Bub 0.5; older Bub would ignore the
    # hook and keep running commands unsandboxed.
    "bub>=0.5.0",
    "loguru",
    "pydantic",
    "pydantic-settings>=2.10.1",
]

[project.entry-points.bub]
sandbox-env = "bub_sandbox_env.plugin"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
