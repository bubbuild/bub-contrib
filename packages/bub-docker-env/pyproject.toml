[project]
name = "bub-docker-env"
version = "0.1.0"
description = "Run Bub sessions' bash, fs and code-mode tools in Docker containers"
readme = "README.md"
authors = [
    { name = "wzhongyun", email= "wzhongyun@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    # provide_environment exists from Bub 0.5; older Bub would ignore the
    # hook and keep running commands on the host.
    "bub>=0.5.0",
    "loguru",
    "pydantic",
    "pydantic-settings>=2.10.1",
]

[project.entry-points.bub]
docker-env = "bub_docker_env.plugin"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
